name: Release

# Publish when the production branch (`release`) is pushed.
# so if the current version is already published to The Gradle Plugin Portal,
#  this is a no-op. That makes it safe to push non-version commits
# to `release` (docs, chores) without turning CI red.

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # restricted to branch `release`
    # GitHub refuses the job from any other ref.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from build.gradle.kts
        id: version
        run: echo "value=$(grep -m1 -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on the Plugin Portal
        id: exists
        run: |
          v="${{ steps.version.outputs.value }}"
          url="https://plugins.gradle.org/m2/io/github/fluxxware/tokia/io.github.fluxxware.tokia.gradle.plugin/${v}/io.github.fluxxware.tokia.gradle.plugin-${v}.pom"
          # The m2 endpoint 303-redirects to Maven Central, and `curl -f` treats 3xx as success —
          # so follow redirects and require a real 200 to mean "already published".
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Version ${v} is already published — nothing to do."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Version ${v} is not on the Portal (HTTP ${code}) — will publish."
          fi

      - name: Publish to Gradle Plugin Portal
        if: steps.exists.outputs.present == 'false'
        run: ./gradlew publishPlugins --console=plain
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Nothing to do
        if: steps.exists.outputs.present == 'true'
        run: echo "Version ${{ steps.version.outputs.value }} already published — skipping."
